[project]
name = "ayadb"
version = "0.0.1"
description = "Reliable, efficient tool calling for Tiny Aya on a verifiable database environment (Lexsi hackathon, Track 3)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "agenttune==1.1.3",
    "auditkit==1.1.3",
    "gguf",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
